services:
  backend:
    build:
      context: .
      target: runner
    container_name: backend-contact-management
    ports:
      - 3000:3000
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      ACCESS_EXPIRES_IN: "15m"
      REFRESH_EXPIRES_IN: "1d"
      REDIS_DATABASE_URL: ${REDIS_DATABASE_URL:-redis://admin:admin123@redis:6379}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-admin}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-admin123}
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: database-contact-management
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-database}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    volumes:
      - contact_management_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-database}",
        ]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:alpine
    container_name: redis-server-contact-management
    restart: always
    volumes:
      - ./src/config/redis.conf:/usr/local/etc/redis/redis.conf
      - redis-contact-management:/data
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

volumes:
  contact_management_data:
  redis-contact-management:
